spark.master                          yarn
spark.submit.deployMode               client
# Spark 4.3 is installed on every node by the bootstrap action, so YARN containers use
# the local jars instead of uploading them on every submit.
spark.yarn.jars                       local:/opt/spark-sdp/jars/*
spark.yarn.appMasterEnv.PYSPARK_PYTHON  /opt/spark-sdp/venv/bin/python
spark.executorEnv.PYSPARK_PYTHON      /opt/spark-sdp/venv/bin/python
# Route s3:// through the S3A connector (emr-spark-8.0.0 has no EMRFS).
spark.hadoop.fs.s3.impl               org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.AbstractFileSystem.s3.impl  org.apache.hadoop.fs.s3a.S3A
spark.sql.ansi.enabled                true
