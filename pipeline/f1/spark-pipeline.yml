name: f1-analytics-declarative-pipeline
catalog: glue_catalog
database: {database}
storage: s3://{bucket}/{prefix}/state/
configuration:
  # Iceberg tables registered in the AWS Glue Data Catalog -- needed for proper
  # catalog registration/queryability and for streaming tables' cross-run
  # incremental checkpoint persistence. The Iceberg runtime + AWS bundle jars are
  # baked into the Spark bundle (see docker/build_bundle.sh).
  spark.sql.catalog.glue_catalog: "org.apache.iceberg.spark.SparkCatalog"
  spark.sql.catalog.glue_catalog.catalog-impl: "org.apache.iceberg.aws.glue.GlueCatalog"
  spark.sql.catalog.glue_catalog.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
  spark.sql.catalog.glue_catalog.warehouse: "s3://{bucket}/{prefix}/warehouse"
  # Iceberg's GlueCatalog client-side-validates table/namespace names against a
  # stricter character set than Glue itself actually enforces, and rejects some
  # otherwise-valid names. Found empirically (console debugging against the live
  # job, confirmed via CloudTrail) to be required for this pipeline's tables to
  # register successfully -- moved here so it's real, version-controlled config
  # instead of a manual job-level default that `cdk deploy` would silently wipe.
  spark.sql.catalog.glue_catalog.glue.skip-name-validation: "true"
  # Jolpica-F1 API (the Ergast successor; https://github.com/jolpica/jolpica-f1).
  # Data licence CC BY-NC-SA 4.0 (non-commercial); limits 4 requests/second and
  # 500/hour; a descriptive User-Agent is required. Deploy-time defaults only:
  # season/round are NOT set here, they are per-run --conf arguments (one run =
  # one race, see bootstrap/run_pipeline_step.sh). All keys are "spark."-prefixed
  # because spark-submit silently drops other --conf keys (SPARK-7037).
  spark.f1.api.base_url: "{api_base_url}"
  spark.f1.api.user_agent: "aws-emr-spark-declarative-pipelines/1.0"
  # The raw zone reads the API directly through the PySpark Python Data Source
  # f1_pipeline_lib/f1_source.py (format "f1_api"): nothing is staged in S3.
  # Second, independent, non-API reference source: static circuit track-type
  # (street/permanent/hybrid) CSVs, deployed declaratively to this prefix by
  # the CDK stack's BucketDeployment construct (not fetched/staged at run
  # time). A directory, not a single file key -- the streaming file source in
  # 00_bronze_circuit_track_type.py watches it for new files.
  spark.f1.reference.circuit_track_type.path: "s3://{bucket}/{prefix}/reference-data/circuit_track_type/"
libraries:
  # Must come first: makes f1_pipeline_lib importable for every transformation
  # file below, in one place -- see _sys_path_bootstrap.py. SDP execs each
  # libraries: glob entry's matching files in the order the entries appear
  # here (confirmed from pyspark/pipelines/cli.py::register_definitions),
  # so this entry running before transformations/** is guaranteed, not
  # incidental.
  - glob:
      include: _sys_path_bootstrap.py
  - glob:
      include: transformations/**
